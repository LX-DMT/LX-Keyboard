name: ESP-IDF 5.5.6 firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone layout and tests
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python scripts/verify_portability.py
          python scripts/check_release.py
          python -m unittest discover -s tests -p 'test_*.py'
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        board: [keyboard, knob, receiver]
    steps:
      - uses: actions/checkout@v4
      - name: Build only the selected standalone folder
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cp -a "${{ matrix.board }}" "$RUNNER_TEMP/lx-${{ matrix.board }}"
          cd "$RUNNER_TEMP/lx-${{ matrix.board }}"
          idf.py build
      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.board }}
          path: ${{ runner.temp }}/lx-${{ matrix.board }}/build/log/
          if-no-files-found: ignore
