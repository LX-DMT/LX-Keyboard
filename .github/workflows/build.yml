name: ESP-IDF 5.5.6 firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        board: [keyboard, knob, receiver]
    steps:
      - uses: actions/checkout@v4
      - name: Verify, test and build
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python scripts/verify_portability.py
          python scripts/check_release.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build.py "${{ matrix.board }}"
      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.board }}
          path: artifacts/logs/
          if-no-files-found: ignore
